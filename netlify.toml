# Next.js app in /frontend. Built-in Next runtime (no @netlify/plugin-nextjs).
# In Netlify UI: leave "Publish directory" EMPTY (not "frontend/").
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
